<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>{% block title %}{% endblock %} · {{ business_name }}</title>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('dashboard') }}">{% include "_mark.html" %}{{ business_name }}</a>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint in ('dashboard','packet_detail') }}">Packets</a>
      <a href="{{ url_for('library') }}" class="{{ 'active' if request.endpoint in ('library','new_form','edit_form') }}">Form library</a>
    </nav>
    <a class="btn btn-primary" href="{{ url_for('new_packet') }}">New packet</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn btn-quiet">Sign out</button></form>
  </div>
</header>
<main class="wrap {% block wrapclass %}{% endblock %}">
{% include "_flash.html" %}
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
